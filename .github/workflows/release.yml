name: Publish Docker image

on:
  push:
    branches: [ main ]

permissions:
  # Required for pushing the generated manifest commit to the release branch.
  contents: write

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server/
          file: ./server/dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-psu:latest

  touch-k8s-manifest:
    # Publish the GitOps manifest only if the image is already available.
    needs: [ push_to_registry ]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Insert release date into manifest
        # A new pod-template label forces Kubernetes to pull and deploy :latest.
        run: |
          sed -i "s/release-date: .*/release-date: \"$(date +%s)\"/g" ./server-k8s-manifests/devops-psu.yml

      - name: Commit manifest into release branch
        # Argo CD watches this branch rather than the application source branch.
        run: |
          git config --global user.name 'Release Runner'
          git config --global user.email 'runner@users.noreply.github.com'
          git add ./server-k8s-manifests/devops-psu.yml
          git commit -m "Release $(date +%F-%H%M%S)" || echo "No changes to commit"
          git push --force origin HEAD:release
