apiVersion: v1
kind: Namespace
metadata:
  name: devops-psu

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-psu
  namespace: devops-psu
  labels:
    app: devops-psu
    # release.yml replaces this value with a Unix timestamp on every release.
    release-date: RELEASE-DATE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-psu
  template:
    metadata:
      labels:
        app: devops-psu
        svc: frontend
        # Changing the pod-template label triggers a rollout for the latest tag.
        release-date: RELEASE-DATE
    spec:
      containers:
        - name: devops-psu-server
          image: timerider33/devops-psu:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: service-devops
  namespace: devops-psu
  labels:
    app: devops-psu
spec:
  type: LoadBalancer
  selector:
    app: devops-psu
    svc: frontend
  ports:
    # Clients use 12345; the Python server listens on 8000 in the container.
    - port: 12345
      targetPort: 8000
  externalIPs:
    - 10.0.22.2
